name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
        env:
          VITE_BASE_PATH: /debgen/

      - name: Verify deployable static output
        run: |
          test -s dist/en/index.html
          test -s dist/de/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/api/v1/releases.json
          grep -F 'href="/debgen/assets/site.css"' dist/en/index.html
          grep -F 'href="https://debgen.org/en/"' dist/en/index.html

      - name: Audit dependencies
        run: npm audit
