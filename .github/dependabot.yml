version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint supports only typescript <6.1.0; drop once it supports 7.x.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
