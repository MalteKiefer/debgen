version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    # Only propose releases that have been public for at least 7 days.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # vue and @vue/* must move together; mixed versions break SSR rendering.
      vue:
        patterns:
          - vue
          - '@vue/*'
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint supports only typescript <6.1.0; drop once it supports 7.x.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
